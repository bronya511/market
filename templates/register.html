{% extends "base.html" %}
{% block title %}注册 | 校园二手交易系统{% endblock %}
{% block card_class %}register-card{% endblock %}
{% block content %}
<h2>创建账号</h2>
<form method="post" class="register-form">
  <label class="register-account">数字账号<input name="account" inputmode="numeric" autocomplete="username" required></label>
  <div class="password-field">
    <label for="register-password">密码</label>
    <div class="login-password-field">
      <input id="register-password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" minlength="8" maxlength="20" required>
      <button class="login-password-toggle" type="button" aria-label="显示密码" aria-controls="register-password" aria-pressed="false">
        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A11 11 0 0 1 12 6c6 0 9.5 6 9.5 6a13.5 13.5 0 0 1-3.1 3.5M6.2 7.6C3.8 9.3 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.3 3.6-.8"/><path d="M10 10a3 3 0 0 0 4 4"/></svg>
      </button>
    </div>
    <noscript><p class="hint">密码为8～20位，需包含大小写字母、数字和特殊标点符号。</p></noscript>
  </div>
  <aside id="password-help" class="password-help" aria-label="密码填写要求" hidden>
    <h3>密码填写要求</h3>
    <ul>
      <li data-rule="length"><span class="rule-icon" aria-hidden="true">○</span><span>8～20位</span><span class="rule-status">未满足</span></li>
      <li data-rule="lower"><span class="rule-icon" aria-hidden="true">○</span><span>小写字母</span><span class="rule-status">未满足</span></li>
      <li data-rule="upper"><span class="rule-icon" aria-hidden="true">○</span><span>大写字母</span><span class="rule-status">未满足</span></li>
      <li data-rule="digit"><span class="rule-icon" aria-hidden="true">○</span><span>数字</span><span class="rule-status">未满足</span></li>
      <li data-rule="punctuation"><span class="rule-icon" aria-hidden="true">○</span><span>特殊标点符号</span><span class="rule-status">未满足</span></li>
    </ul>
    <p id="password-progress" role="status" aria-live="polite">已满足 0/5 项</p>
  </aside>
  <button class="register-submit" type="submit">注册</button>
</form>
<p>已有账号？<a href="{{ url_for('login') }}">返回登录</a></p>
<script src="{{ url_for('static', filename='register.js') }}" defer></script>
{% endblock %}
